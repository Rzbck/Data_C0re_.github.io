<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-label="Hardwinner P6 LED module grid"><rect width="960" height="720" fill="#120022"/><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="none" stroke="#f4f1eb" stroke-width="0.8"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="#f4f1eb" stroke-width="0.8"/></pattern></defs><rect x="82" y="72" width="768" height="384" fill="url(#grid)" stroke="#f4f1eb" stroke-width="2"/><path d="M82 480H850 M58 72V456" stroke="#f4f1eb" stroke-width="2"/><text x="82" y="561" fill="#f4f1eb" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="46" letter-spacing="-2">P6 MODULE GRID</text><text x="527" y="561" fill="#f4f1eb" font-family="Arial,Helvetica,sans-serif" font-size="20">LED SMD</text><text x="82" y="614" fill="#f4f1eb" font-family="Arial,Helvetica,sans-serif" font-size="15">PIXEL PITCH = 6 MM</text><text x="332" y="614" fill="#f4f1eb" font-family="Arial,Helvetica,sans-serif" font-size="15">X = 192 MM / 32 PX</text><text x="582" y="614" fill="#f4f1eb" font-family="Arial,Helvetica,sans-serif" font-size="15">Y = 96 MM / 16 PX</text><text x="82" y="644" fill="#aea3b9" font-family="Arial,Helvetica,sans-serif" font-size="13">LED Ø = 3 MM</text><text x="332" y="644" fill="#aea3b9" font-family="Arial,Helvetica,sans-serif" font-size="13">GRAPHIC UNIT a = 24 MM / 4 PX</text></svg>