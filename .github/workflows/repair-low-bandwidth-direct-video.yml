name: One-shot repair low-bandwidth direct video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-low-bandwidth-direct-video.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace temporary chunk transport with a normal project MP4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          import shutil

          chunk_dir = Path('.tmp/low-bandwidth-excerpt')
          parts = sorted(chunk_dir.glob('part*'))
          if not parts:
              raise SystemExit('No staged video parts found.')

          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          encoded += '=' * ((-len(encoded)) % 4)
          try:
              video = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f'Chunk payload is not valid base64: {exc}')

          if len(video) < 100_000:
              raise SystemExit(f'Decoded MP4 is unexpectedly small: {len(video)} bytes')
          if len(video) < 12 or video[4:8] != b'ftyp':
              raise SystemExit('Decoded payload is not an MP4 file.')
          moov = video.find(b'moov')
          mdat = video.find(b'mdat')
          if moov < 0 or mdat < 0 or moov > mdat:
              raise SystemExit(f'MP4 fast-start structure check failed: moov={moov}, mdat={mdat}')

          media = Path('assets/media/low-bandwidth-message/excerpt.mp4')
          media.write_bytes(video)
          print(f'Wrote direct MP4: {media} ({len(video)} bytes)')

          targets = [
              Path('projects/last-low-bandwidth-message.html'),
              Path('en/projects/last-low-bandwidth-message.html'),
              Path('fr/projects/last-low-bandwidth-message.html'),
              Path('es/projects/last-low-bandwidth-message.html'),
          ]
          standard = '<video muted="" loop="" playsinline="" poster="assets/media/low-bandwidth-message/promo.webp" data-lazy-video=""><source data-src="assets/media/low-bandwidth-message/excerpt.mp4" type="video/mp4"></video>'
          pattern = re.compile(
              r'<video[^>]*poster="assets/media/low-bandwidth-message/promo\.webp"[^>]*>\s*<source[^>]*(?:excerpt\.mp4)[^>]*>\s*</video>',
              re.I,
          )
          for path in targets:
              html = path.read_text(encoding='utf-8')
              html2, count = pattern.subn(standard, html, count=1)
              if count != 1:
                  raise SystemExit(f'Could not normalize video markup in {path}')
              path.write_text(html2, encoding='utf-8')
              print(f'Normalized standard lazy-video markup: {path}')

          Path('scripts/low-bandwidth-video-standardize.mjs').unlink(missing_ok=True)
          shutil.rmtree(chunk_dir)
          try:
              Path('.tmp').rmdir()
          except OSError:
              pass

          # This workflow exists only to replace the previous chunk workaround.
          Path('.github/workflows/repair-low-bandwidth-direct-video.yml').unlink(missing_ok=True)
          PY

      - name: Commit clean direct-video state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Use standard direct MP4 playback for low-bandwidth project'
          git push origin HEAD:main
