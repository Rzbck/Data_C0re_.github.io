name: Search Console monitor

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-console-monitor
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GSC_SITE_URL: https://datac0re.is-a.dev/
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_INCLUDE_QUERIES: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google API dependencies
        run: python -m pip install --disable-pip-version-check google-auth requests

      - name: Collect Search Console metrics
        run: python scripts/search-console-report.py

      - name: Upload SEO report
        uses: actions/upload-artifact@v4
        with:
          name: search-console-report-${{ github.run_number }}
          path: output/search-console/
          if-no-files-found: error
          retention-days: 14
