name: One-shot FJM mobile Ambilight master

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/dev-fjm-mobile-ambient-master-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Replace FJM mobile Ambilight handoff with persistent master emitter
        shell: bash
        run: |
          before_fr="$(sha256sum fr/projects/fjm-atlas.html | cut -d' ' -f1)"
          before_script="$(sha256sum scripts/fjm-atlas-real-media-v1.mjs | cut -d' ' -f1)"

          python - <<'PY'
          from pathlib import Path
          import re, base64

          amb = Path('assets/js/video-ambilight-v1.js')
          s = amb.read_text(encoding='utf-8')
          pattern = re.compile(r"  /\* FJM Atlas mobile:[\s\S]*?\n  const wake=\(\)=>schedule\(0\);", re.M)
          replacement = base64.b64decode("").decode("utf-8")
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected one FJM special runtime block, patched {count}')
          amb.write_text(s2, encoding='utf-8')

          routes = Path('assets/js/language-routes.js')
          r = routes.read_text(encoding='utf-8')
          old = "ensureScript('assets/js/video-ambilight-v1.js?v=20260909-fjm-mobile1','data-video-ambilight');"
          new = "ensureScript('assets/js/video-ambilight-v1.js?v=20260909-fjm-mobile2','data-video-ambilight');"
          if old in r:
              r = r.replace(old, new, 1)
          elif new not in r:
              raise SystemExit('Expected FJM mobile1 Ambilight loader not found')
          routes.write_text(r, encoding='utf-8')
          PY

          node --check assets/js/video-ambilight-v1.js
          node --check assets/js/language-routes.js

          after_fr="$(sha256sum fr/projects/fjm-atlas.html | cut -d' ' -f1)"
          after_script="$(sha256sum scripts/fjm-atlas-real-media-v1.mjs | cut -d' ' -f1)"
          test "$before_fr" = "$after_fr"
          test "$before_script" = "$after_script"

      - name: Verify stable FJM mobile master emitter only
        shell: bash
        run: |
          grep -q "let fjmMasterStatic=null" assets/js/video-ambilight-v1.js
          grep -q "const resolveFjmMaster=now=>" assets/js/video-ambilight-v1.js
          grep -q "setFjmViewportGeometry(masterState)" assets/js/video-ambilight-v1.js
          grep -q "video-ambilight-v1.js?v=20260909-fjm-mobile2" assets/js/language-routes.js
          ! grep -q "fjmScrollCarry" assets/js/video-ambilight-v1.js
          ! grep -q "freezeGeometry" assets/js/video-ambilight-v1.js
          grep -q 'grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)' fr/projects/fjm-atlas.html
          grep -q 'fjm-story-tech{grid-column:1 / -1;width:100%' fr/projects/fjm-atlas.html
          test "$(grep -o 'data-ambilight-white-guard=\"off\"' fr/projects/fjm-atlas.html | wc -l)" -eq 4
          git diff --check

      - name: Commit DEV runtime fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/video-ambilight-v1.js assets/js/language-routes.js
          if git diff --cached --quiet; then
            echo "FJM mobile master Ambilight already applied."
          else
            git commit -m "Keep FJM Atlas mobile Ambilight continuously stable"
            git push origin HEAD:dev
          fi
