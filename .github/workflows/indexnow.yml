name: Notify IndexNow

on:
  workflow_run:
    workflows: ["Build localized static pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build and validate IndexNow payload
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from urllib.parse import urlparse

          with open('site.config.json', encoding='utf-8') as f:
              config = json.load(f)
          origin = config['origin'].rstrip('/')
          host = urlparse(origin).hostname
          key = 'de2a1c7c9c8cc2396de53eec921730dc'

          with open('sitemap.xml', encoding='utf-8') as f:
              xml = f.read()
          urls = re.findall(r'<loc>(.*?)</loc>', xml)
          if not urls:
              raise SystemExit('No URLs found in sitemap.xml')

          invalid = [url for url in urls if not (url == origin or url.startswith(origin + '/'))]
          if invalid:
              raise SystemExit('Sitemap contains URLs outside current origin: ' + ', '.join(invalid[:5]))

          payload = {
              'host': host,
              'key': key,
              'keyLocation': f'{origin}/{key}.txt',
              'urlList': urls,
          }
          with open('payload.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False)
          print(f'IndexNow host: {host}')
          print(f'URLs submitted: {len(urls)}')
          PY

      - name: Submit URLs to IndexNow
        shell: bash
        run: |
          code=$(curl -sS -o response.txt -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" --data-binary @payload.json)
          cat response.txt || true
          echo "IndexNow HTTP status: $code"
          case "$code" in 200|202) exit 0 ;; *) exit 1 ;; esac
