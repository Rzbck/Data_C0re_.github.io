name: Notify IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Submit public URLs to IndexNow
        shell: bash
        run: |
          cat > payload.json <<'JSON'
          {
            "host": "rzbck.github.io",
            "key": "de2a1c7c9c8cc2396de53eec921730dc",
            "keyLocation": "https://rzbck.github.io/Data_C0re_.github.io/de2a1c7c9c8cc2396de53eec921730dc.txt",
            "urlList": [
              "https://rzbck.github.io/Data_C0re_.github.io/",
              "https://rzbck.github.io/Data_C0re_.github.io/work.html",
              "https://rzbck.github.io/Data_C0re_.github.io/about.html",
              "https://rzbck.github.io/Data_C0re_.github.io/cv.html",
              "https://rzbck.github.io/Data_C0re_.github.io/lab.html",
              "https://rzbck.github.io/Data_C0re_.github.io/projects/ascii.html",
              "https://rzbck.github.io/Data_C0re_.github.io/projects/snake.html",
              "https://rzbck.github.io/Data_C0re_.github.io/projects/lumina.html",
              "https://rzbck.github.io/Data_C0re_.github.io/projects/realtime.html",
              "https://rzbck.github.io/Data_C0re_.github.io/projects/hardwinner.html",
              "https://rzbck.github.io/Data_C0re_.github.io/projects/cloud.html",
              "https://rzbck.github.io/Data_C0re_.github.io/projects/grand-theatre.html",
              "https://rzbck.github.io/Data_C0re_.github.io/projects/comedie.html",
              "https://rzbck.github.io/Data_C0re_.github.io/projects/stage-systems.html"
            ]
          }
          JSON
          code=$(curl -sS -o response.txt -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" --data-binary @payload.json)
          cat response.txt || true
          echo "IndexNow HTTP status: $code"
          case "$code" in 200|202) exit 0 ;; *) exit 1 ;; esac
