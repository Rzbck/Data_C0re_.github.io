# trigger 2026-08-20 v2
name: Dev Ambilight neutral-dominance v2

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/ambilight-neutral-dominance-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch conservative whole-frame neutral veto
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js = Path('assets/js/video-ambilight-v1.js')
          s = js.read_text()

          old = '/* DATA C0RE ambient runtime v23-dev — production Ambilight unchanged unless an ultra-conservative neutral edge veto fires. */'
          new = '/* DATA C0RE ambient runtime v24-dev — production Ambilight unchanged unless a conservative neutral-dominance veto fires. */'
          assert old in s
          s = s.replace(old, new, 1)

          marker = "  const ensureLayer=()=>{"
          assert marker in s
          frame_guard = r'''  /* Second-stage DEV guard: the edge guard alone can amplify the few warm pixels
     left inside an otherwise white/grey/cream frame. This whole-frame test only
     vetoes when muted/neutral coverage clearly dominates. It never rejects a hue. */
  const neutralGuardFrame=data=>{
    const chroma=[],light=[];
    let verySoft=0,muted=0,strong=0,vivid=0,brightMuted=0;
    const total=Math.max(CANVAS_W*CANVAS_H,1);
    for(let p=0;p<total;p++){
      const i=p*4;
      const [L,C]=oklabLC(data[i],data[i+1],data[i+2]);
      chroma.push(C);light.push(L);
      if(C<.065)verySoft++;
      if(C<.12)muted++;
      if(C>=.16)strong++;
      if(C>=.20)vivid++;
      if(L>=.50&&C<.115)brightMuted++;
    }
    chroma.sort((a,b)=>a-b);light.sort((a,b)=>a-b);
    const metrics={
      c50:quantile(chroma,.50),
      c75:quantile(chroma,.75),
      c90:quantile(chroma,.90),
      l50:quantile(light,.50),
      l75:quantile(light,.75),
      verySoft:verySoft/total,
      muted:muted/total,
      strong:strong/total,
      vivid:vivid/total,
      brightMuted:brightMuted/total
    };
    metrics.veto=Boolean(
      metrics.muted>.64 &&
      metrics.strong<.13 &&
      metrics.vivid<.075 &&
      metrics.c75<.12 &&
      (metrics.brightMuted>.28 || (metrics.verySoft>.42&&metrics.c50<.078))
    );
    return metrics;
  };

'''
          s = s.replace(marker, frame_guard + marker, 1)

          old_block = r'''      const guard={
        left:neutralGuardEdge(data,pointSets.left),
        right:neutralGuardEdge(data,pointSets.right),
        top:neutralGuardEdge(data,pointSets.top),
        bottom:neutralGuardEdge(data,pointSets.bottom)
      };
      const vetoed=Object.keys(guard).filter(key=>guard[key].veto);
      const record={src:mediaSource(media),kind:state.kind,vetoedEdges:vetoed,edges:guard,at:performance.now()};
'''
          new_block = r'''      const guard={
        left:neutralGuardEdge(data,pointSets.left),
        right:neutralGuardEdge(data,pointSets.right),
        top:neutralGuardEdge(data,pointSets.top),
        bottom:neutralGuardEdge(data,pointSets.bottom)
      };
      const frameGuard=neutralGuardFrame(data);
      const vetoed=frameGuard.veto?['left','right','top','bottom']:Object.keys(guard).filter(key=>guard[key].veto);
      const record={src:mediaSource(media),kind:state.kind,frameVeto:frameGuard.veto,vetoedEdges:vetoed,frame:frameGuard,edges:guard,at:performance.now()};
'''
          assert old_block in s
          s = s.replace(old_block, new_block, 1)

          old_log = "        if(vetoed.length)console.info('[DATA C0RE Ambilight neutral guard]',record);"
          new_log = "        if(vetoed.length)console.info('[DATA C0RE Ambilight neutral guard v2]',record);"
          assert old_log in s
          s = s.replace(old_log, new_log, 1)

          old_status = r'''    kind:record.kind,
    vetoedEdges:[...record.vetoedEdges],
    edges:record.edges
'''
          new_status = r'''    kind:record.kind,
    frameVeto:Boolean(record.frameVeto),
    vetoedEdges:[...record.vetoedEdges],
    frame:record.frame,
    edges:record.edges
'''
          assert old_status in s
          s = s.replace(old_status, new_status, 1)

          js.write_text(s)

          routes = Path('assets/js/language-routes.js')
          r = routes.read_text()
          old_ver = "assets/js/video-ambilight-v1.js?v=20260820-23guarddev"
          new_ver = "assets/js/video-ambilight-v1.js?v=20260820-24guarddev"
          assert old_ver in r
          routes.write_text(r.replace(old_ver, new_ver, 1))
          PY

          node --check assets/js/video-ambilight-v1.js
          node --check assets/js/language-routes.js

      - name: Commit test runtime
        shell: bash
        run: |
          git config user.name 'Data_C0re_'
          git config user.email '10966796+Rzbck@users.noreply.github.com'
          git add assets/js/video-ambilight-v1.js assets/js/language-routes.js
          git commit -m 'Strengthen neutral-dominance Ambilight veto on dev'
          git push origin dev
