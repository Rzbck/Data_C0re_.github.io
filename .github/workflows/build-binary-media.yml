name: Build binary media

on:
  push:
    paths:
      - '.github/workflows/build-binary-media.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode FX showreel MP4
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode assets/media/research/fx-showreel.b64 > assets/media/research/fx-showreel.mp4
          test -s assets/media/research/fx-showreel.mp4
          file assets/media/research/fx-showreel.mp4

      - name: Decode TouchDesigner network JPEG
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode assets/media/research/fx-network.jpg > /tmp/fx-network-level1.b64
          tr -d '\r\n\t ' < /tmp/fx-network-level1.b64 | base64 --decode > assets/media/research/fx-network-decoded.jpg
          test -s assets/media/research/fx-network-decoded.jpg
          file assets/media/research/fx-network-decoded.jpg

      - name: Commit real binary assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/media/research/fx-showreel.mp4 assets/media/research/fx-network-decoded.jpg
          if git diff --cached --quiet; then
            echo 'No binary media changes.'
            exit 0
          fi
          git commit -m 'Build real binary FX media assets'
          git push origin HEAD:main
