name: Upgrade favicon assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/favicon-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Add high-resolution favicon assets
        shell: bash
        run: |
          mkdir -p assets/img
          cat > /tmp/favicon180.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/favicon180.b64 | base64 -d > assets/img/favicon-180.png
          cp assets/img/favicon-180.png apple-touch-icon.png
      - name: Standardize favicon markup site-wide
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const skip=new Set(['node_modules','.git']);
          const files=[];
          function walk(dir='.'){
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              if(skip.has(ent.name)) continue;
              const p=path.join(dir,ent.name);
              if(ent.isDirectory()) walk(p);
              else if(ent.name.endsWith('.html')) files.push(p);
            }
          }
          walk();
          const block='<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" sizes="any"><link rel="icon" href="assets/img/favicon-180.png" type="image/png" sizes="180x180"><link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">';
          let changed=0;
          for(const file of files){
            let html=fs.readFileSync(file,'utf8');
            const before=html;
            const pair=/<link rel="icon"[^>]*href="(?:\.\/)?favicon\.ico"[^>]*>\s*<link rel="icon"[^>]*href="(?:\.\/)?assets\/img\/favicon\.svg"[^>]*>/i;
            if(pair.test(html)) html=html.replace(pair,block);
            else if(!/favicon-180\.png/i.test(html)) html=html.replace('</head>',`${block}\n</head>`);
            if(html!==before){fs.writeFileSync(file,html);changed++;}
          }
          console.log(`favicon markup updated in ${changed} HTML files`);
          NODE
      - name: Upgrade web manifest
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='site.webmanifest';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          m.icons=[
            {src:'./assets/img/favicon.svg',sizes:'any',type:'image/svg+xml',purpose:'any'},
            {src:'./assets/img/favicon-180.png',sizes:'180x180',type:'image/png',purpose:'any'}
          ];
          fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');
          NODE
      - name: Validate assets
        run: |
          test -s assets/img/favicon-180.png
          test -s apple-touch-icon.png
          grep -q 'favicon-180.png' index.html
          grep -q 'apple-touch-icon' index.html
          grep -q 'favicon-180.png' site.webmanifest
      - name: Commit favicon upgrade
        run: |
          rm -f .github/workflows/favicon-upgrade.yml
          git config user.name 'Data_C0re_'
          git config user.email '10966796+Rzbck@users.noreply.github.com'
          git add -A
          git commit -m 'Harden favicons for browser tabs and Google Search'
          git push
