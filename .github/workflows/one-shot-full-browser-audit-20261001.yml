name: One-shot full browser audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-full-browser-audit-20261001.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install audit dependencies
        run: npm install --no-save --package-lock=false cheerio@1.0.0 playwright@1.55.0

      - name: Verify static navigation and SEO
        run: |
          node scripts/check-navigation-home-links.mjs
          node scripts/check-project-taxonomy.mjs
          node scripts/check-locale-parity.mjs
          node scripts/check-analytics-integration.mjs
          node scripts/check-seo-indexation-architecture.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/datac0re-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/datac0re-http.log
          exit 1

      - name: Audit INDEX interaction desktop and mobile
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173
        run: node scripts/check-index-trail-browser.mjs

      - name: Audit all responsive routes EN FR ES
        env:
          AUDIT_BASE_URL: http://127.0.0.1:4173
        run: node scripts/release-responsive-audit.mjs

      - name: Remove successful one-shot audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-full-browser-audit-20261001.yml
          git add .github/workflows/one-shot-full-browser-audit-20261001.yml
          git commit -m "Remove completed one-shot browser audit"
          git push origin HEAD:main
