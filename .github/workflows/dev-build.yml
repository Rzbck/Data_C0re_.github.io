name: Build dev portfolio pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-dev-pages
  cancel-in-progress: true

jobs:
  dev-build:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install generator dependency
        run: npm install --no-save --package-lock=false cheerio@1.0.0

      - name: Apply portfolio architecture
        run: node scripts/portfolio-architecture.mjs

      - name: Apply international service-area SEO source
        run: node scripts/international-service-seo.mjs

      - name: Generate EN / FR / ES static pages
        run: node scripts/build-localized.mjs

      - name: Apply localized project SEO metadata
        run: node scripts/seo-localized-overrides.mjs

      - name: Polish localized structured data + copy
        run: node scripts/postprocess-localized.mjs

      - name: Reapply international service-area localized copy
        run: node scripts/international-service-seo.mjs

      - name: Clean recruiter-facing copy
        run: node scripts/professional-copy-cleanup.mjs

      - name: Integrate secure contact route
        run: node scripts/contact-site-integration.mjs

      - name: Apply editorial FR / ES localization
        run: node scripts/editorial-localization.mjs

      - name: Polish Work Archive Lab and SIGNAL localization
        run: node scripts/portfolio-architecture-polish.mjs

      - name: Finalize localized SIGNAL diagram and metadata
        run: node scripts/portfolio-architecture-finalize.mjs

      - name: Apply structured index and clean contact interaction
        run: node scripts/menu-layout-integration.mjs

      - name: Apply FR / ES display spacing while preserving accents
        run: node scripts/display-heading-diacritics.mjs

      - name: Balance display and supporting copy layouts
        run: node scripts/layout-balance-integration.mjs

      - name: Synchronize canonical origin
        run: node scripts/sync-origin.mjs

      - name: Collapse portfolio to Home Archive CV Contact
        run: node scripts/portfolio-editorial-simplify.mjs

      - name: Finalize legacy Lab redirects
        run: node scripts/lab-redirect-finalize.mjs

      - name: Apply final V2 cleanup
        run: node scripts/portfolio-v2-finalize.mjs

      - name: Apply compact Home V3
        run: node scripts/home-compact-v3.mjs

      - name: Stabilize language switcher before first paint
        run: node scripts/static-language-links.mjs

      - name: Apply simplified SIGNAL development case study
        run: node scripts/signal-project-page-v1.mjs

      - name: Apply full-screen SIGNAL hero composition
        run: node scripts/signal-hero-v2.mjs

      - name: Rebuild optimized SIGNAL simulation media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/media/signal
          python - <<'PY'
          import base64, glob, re
          parts = []
          for path in sorted(glob.glob('scripts/signal-media/video.part*.b64')):
              parts.append(open(path, 'r', encoding='utf-8').read())
          data = ''.join(parts)
          data = re.sub(r'[^A-Za-z0-9+/=]', '', data).replace('=', '')
          data += '=' * ((-len(data)) % 4)
          decoded = base64.b64decode(data)
          assert len(decoded) == 61754, f'unexpected SIGNAL media size: {len(decoded)}'
          assert decoded[4:8] == b'ftyp', 'SIGNAL media is not an MP4 container'
          open('assets/media/signal/simulation-loop.mp4', 'wb').write(decoded)
          print('SIGNAL media reconstructed:', len(decoded), 'bytes')
          PY
          sha256sum assets/media/signal/simulation-loop.mp4
          du -h assets/media/signal/simulation-loop.mp4

      - name: Integrate SIGNAL simulation video
        run: node scripts/signal-video-feature.mjs

      - name: Verify EN FR ES structural parity
        run: node scripts/check-locale-parity.mjs

      - name: Package static dev preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: datac0re-dev-static-bundle
          retention-days: 1
          if-no-files-found: error
          path: |
            *.html
            robots.txt
            sitemap.xml
            favicon.ico
            assets/css
            assets/js
            assets/media/signal
            assets/img/favicon.svg
            assets/img/og-cover.jpg
            projects
            en
            fr
            es

      - name: Commit generated development layer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html work.html about.html services.html lab.html archive.html cv.html contact.html projects en fr es sitemap.xml robots.txt assets/js/seo.js assets/media/signal
          if git diff --cached --quiet; then
            echo "No development generation changes to commit."
          else
            git commit -m "Generate compact portfolio V3"
            git push origin HEAD:dev
          fi
