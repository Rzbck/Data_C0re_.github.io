name: One-shot FJM mobile Ambilight typo fix

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/dev-fjm-mobile-ambient-typo-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Fix runtime typo only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/video-ambilight-v1.js')
          s=p.read_text(encoding='utf-8')
          old='if(document.hidden)nreturn;'
          if old not in s:
              raise SystemExit('Expected runtime typo not found')
          p.write_text(s.replace(old,'if(document.hidden)return;',1),encoding='utf-8')
          PY
          node --check assets/js/video-ambilight-v1.js
          grep -q "let fjmMasterStatic=null" assets/js/video-ambilight-v1.js
          ! grep -q "if(document.hidden)nreturn" assets/js/video-ambilight-v1.js
          git diff --check
      - name: Commit DEV typo fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/video-ambilight-v1.js
          git commit -m "Fix FJM Atlas mobile Ambilight master runtime typo"
          git push origin HEAD:dev
