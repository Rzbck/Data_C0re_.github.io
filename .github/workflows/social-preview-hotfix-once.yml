name: One-shot social preview hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/social-preview-hotfix-once.yml

permissions:
  contents: write

concurrency:
  group: social-preview-hotfix-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch social preview metadata and cache key
        shell: python
        run: |
          from pathlib import Path
          import shutil

          source = Path('assets/img/og-cover.jpg')
          target = Path('assets/img/og-social-20260826-v3.jpg')
          if not source.exists():
              raise SystemExit('Missing source social image')
          data = source.read_bytes()
          if len(data) < 10000 or data[:2] != b'\xff\xd8':
              raise SystemExit('Source social image is not a valid JPEG candidate')
          shutil.copyfile(source, target)

          old_url = 'https://datac0re.is-a.dev/assets/img/og-cover.jpg'
          new_url = 'https://datac0re.is-a.dev/assets/img/og-social-20260826-v3.jpg'
          pages = [Path('index.html'), Path('en/index.html'), Path('fr/index.html'), Path('es/index.html')]

          for path in pages:
              text = path.read_text(encoding='utf-8')
              if old_url not in text:
                  raise SystemExit(f'Safety stop: old social image URL missing in {path}')
              text = text.replace(old_url, new_url)
              needle = f'<meta property="og:image" content="{new_url}">'
              if text.count(needle) != 1:
                  raise SystemExit(f'Safety stop: expected one og:image in {path}')
              enriched = (
                  needle
                  + f'<meta property="og:image:secure_url" content="{new_url}">'
                  + '<meta property="og:image:type" content="image/jpeg">'
                  + '<meta property="og:image:width" content="600">'
                  + '<meta property="og:image:height" content="600">'
              )
              text = text.replace(needle, enriched, 1)
              path.write_text(text, encoding='utf-8')

      - name: Validate social preview patch
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/img/og-social-20260826-v3.jpg
          for f in index.html en/index.html fr/index.html es/index.html; do
            grep -Fq 'https://datac0re.is-a.dev/assets/img/og-social-20260826-v3.jpg' "$f"
            grep -Fq '<meta property="og:image:secure_url"' "$f"
            grep -Fq '<meta property="og:image:type" content="image/jpeg">' "$f"
            grep -Fq '<meta property="og:image:width" content="600">' "$f"
            grep -Fq '<meta property="og:image:height" content="600">' "$f"
          done
          git diff --check

      - name: Remove one-shot workflow and publish hotfix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/social-preview-hotfix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/social-preview-hotfix-once.yml index.html en/index.html fr/index.html es/index.html assets/img/og-social-20260826-v3.jpg
          git commit -m "Fix social preview image delivery and metadata"
          git push origin HEAD:main
