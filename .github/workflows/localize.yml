name: Build localized static pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localized-static-pages
  cancel-in-progress: true

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install generator dependency
        run: npm install --no-save --package-lock=false cheerio@1.0.0

      - name: Generate EN / FR / ES static pages
        run: node scripts/build-localized.mjs

      - name: Polish localized structured data + copy
        run: node scripts/postprocess-localized.mjs

      - name: Synchronize canonical origin
        run: node scripts/sync-origin.mjs

      - name: Commit generated localization layer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A en fr es sitemap.xml robots.txt assets/js/seo.js '*.html' 'projects/*.html'
          if git diff --cached --quiet; then
            echo "No localization changes to commit."
          else
            git commit -m "Generate static EN FR ES SEO routes"
            git push origin HEAD:main
          fi
