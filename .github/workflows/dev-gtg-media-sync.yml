name: Build GTG case study on dev

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/vendor-gtg-media.mjs'
      - 'scripts/gtg-case-study-v1.mjs'
      - '.github/workflows/dev-gtg-media-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtg-case-study-dev
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/dev' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download official GTG media
        run: node scripts/vendor-gtg-media.mjs

      - name: Build selected-systems case study
        run: node scripts/gtg-case-study-v1.mjs

      - name: Commit GTG case study
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/grand-theatre projects/grand-theatre.html en/projects/grand-theatre.html fr/projects/grand-theatre.html es/projects/grand-theatre.html
          if git diff --cached --quiet; then
            echo "GTG case study already synchronized."
          else
            git commit -m "Build GTG selected-systems case study"
            git push origin HEAD:dev
          fi
