name: One-shot FJM Atlas flow layout fix

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/dev-fjm-flow-layout-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch only FJM Atlas process and tech layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/fjm-atlas-real-media-v1.mjs')
          s = p.read_text(encoding='utf-8')

          old_css = ".fjm-atlas-page .fjm-story-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:clamp(34px,5vw,78px);align-items:center}\n.fjm-atlas-page .fjm-story-copy .section-kicker{margin-bottom:clamp(22px,2.6vw,38px)}\n.fjm-atlas-page .fjm-story-copy h2{margin:0 0 24px;font-size:clamp(40px,4.6vw,74px);line-height:.92;letter-spacing:-.055em;max-width:920px}\n.fjm-atlas-page .fjm-story-copy p{margin:0;max-width:860px;color:#b9b7b1;font-size:clamp(16px,1.08vw,19px);line-height:1.48}\n.fjm-atlas-page .fjm-story-copy p+p{margin-top:16px}\n.fjm-atlas-page .fjm-story-flow{margin-top:clamp(24px,2.5vw,38px)}\n.fjm-atlas-page .fjm-story-tech{margin:clamp(20px,2.1vw,30px) 0 0;padding-top:12px;border-top:1px solid var(--line);color:var(--grey);font-size:10px;line-height:1.55;letter-spacing:.07em;text-transform:uppercase}"
          new_css = ".fjm-atlas-page .fjm-story-grid{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);gap:clamp(34px,5vw,78px);align-items:start}\n.fjm-atlas-page .fjm-story-copy .section-kicker{margin-bottom:clamp(22px,2.6vw,38px)}\n.fjm-atlas-page .fjm-story-copy h2{margin:0 0 24px;font-size:clamp(40px,4.6vw,74px);line-height:.92;letter-spacing:-.055em;max-width:920px}\n.fjm-atlas-page .fjm-story-copy p{margin:0;max-width:860px;color:#b9b7b1;font-size:clamp(16px,1.08vw,19px);line-height:1.48}\n.fjm-atlas-page .fjm-story-copy p+p{margin-top:16px}\n.fjm-atlas-page .fjm-story-flow{grid-column:1 / -1;width:100%;margin-top:clamp(4px,.6vw,10px);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:10px 14px;align-items:center}\n.fjm-atlas-page .fjm-story-flow span{min-width:0;text-align:center}\n.fjm-atlas-page .fjm-story-flow b{display:flex;align-items:center;justify-content:center;color:var(--acid);font-size:12px;line-height:1}\n.fjm-atlas-page .fjm-story-tech{grid-column:1 / -1;width:100%;margin:0;padding-top:12px;border-top:1px solid var(--line);color:var(--grey);font-size:10px;line-height:1.55;letter-spacing:.07em;text-transform:uppercase}"
          if old_css not in s:
              raise SystemExit('Expected FJM story CSS block not found')
          s = s.replace(old_css, new_css, 1)

          old_media = "@media(max-width:980px){.fjm-atlas-page .fjm-story-grid{grid-template-columns:1fr;gap:28px}.fjm-atlas-page .fjm-interface-copy{grid-template-columns:1fr;gap:18px}.fjm-atlas-page .fjm-interface-copy p{justify-self:start}.fjm-atlas-page .fjm-real-gallery{grid-template-columns:1fr}}"
          new_media = "@media(max-width:980px){.fjm-atlas-page .fjm-story-grid{grid-template-columns:1fr;gap:28px}.fjm-atlas-page .fjm-story-flow{grid-template-columns:1fr;justify-items:center;gap:8px}.fjm-atlas-page .fjm-story-flow b{transform:rotate(90deg)}.fjm-atlas-page .fjm-interface-copy{grid-template-columns:1fr;gap:18px}.fjm-atlas-page .fjm-interface-copy p{justify-self:start}.fjm-atlas-page .fjm-real-gallery{grid-template-columns:1fr}}"
          if old_media not in s:
              raise SystemExit('Expected FJM responsive CSS block not found')
          s = s.replace(old_media, new_media, 1)

          old_story = "const story = `<section class=\"project-section fjm-story-section\" data-fjm-story=\"\"><div class=\"fjm-story-grid\"><div class=\"fjm-story-copy\"><div class=\"section-kicker reveal\"><span>01</span><p>${c.storyKicker}</p></div><div class=\"reveal\"><h2>${c.storyTitle}</h2><p>${c.briefText}</p><p>${c.responseText}</p></div><div class=\"system-flow fjm-story-flow reveal\">${flow(c.flow)}</div><p class=\"fjm-story-tech reveal\">${c.tech}</p></div><figure class=\"fjm-story-media reveal\"><div class=\"fjm-invitation-visual\"><img src=\"${OVERVIEW}\" alt=\"${c.invitationAlt}\" loading=\"lazy\" ${AMBILIGHT_ATTR}><div class=\"fjm-invitation-card\" aria-hidden=\"true\"><strong>Touchez la carte</strong><em>Explorez les lieux et leurs récits.</em><small>○—○ &nbsp; Pincez ou touchez deux fois pour zoomer</small></div></div><figcaption>${c.invitationCaption}</figcaption></figure></div></section>`;"
          new_story = "const story = `<section class=\"project-section fjm-story-section\" data-fjm-story=\"\"><div class=\"fjm-story-grid\"><div class=\"fjm-story-copy\"><div class=\"section-kicker reveal\"><span>01</span><p>${c.storyKicker}</p></div><div class=\"reveal\"><h2>${c.storyTitle}</h2><p>${c.briefText}</p><p>${c.responseText}</p></div></div><figure class=\"fjm-story-media reveal\"><div class=\"fjm-invitation-visual\"><img src=\"${OVERVIEW}\" alt=\"${c.invitationAlt}\" loading=\"lazy\" ${AMBILIGHT_ATTR}><div class=\"fjm-invitation-card\" aria-hidden=\"true\"><strong>Touchez la carte</strong><em>Explorez les lieux et leurs récits.</em><small>○—○ &nbsp; Pincez ou touchez deux fois pour zoomer</small></div></div><figcaption>${c.invitationCaption}</figcaption></figure><div class=\"system-flow fjm-story-flow reveal\">${flow(c.flow)}</div><p class=\"fjm-story-tech reveal\">${c.tech}</p></div></section>`;"
          if old_story not in s:
              raise SystemExit('Expected FJM story markup not found')
          s = s.replace(old_story, new_story, 1)

          p.write_text(s, encoding='utf-8')
          PY

          node --check scripts/fjm-atlas-real-media-v1.mjs
          node scripts/fjm-atlas-real-media-v1.mjs

      - name: Verify only requested layout changes
        shell: bash
        run: |
          for page in projects/fjm-atlas.html en/projects/fjm-atlas.html fr/projects/fjm-atlas.html es/projects/fjm-atlas.html; do
            grep -q 'fjm-story-flow{grid-column:1 / -1;width:100%' "$page"
            grep -q 'fjm-story-tech{grid-column:1 / -1;width:100%' "$page"
            grep -q 'grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr)' "$page"
            grep -Eq '</figure><div class="system-flow fjm-story-flow reveal">' "$page"
            grep -q 'grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)' "$page"
            grep -q '<span>03</span>' "$page"
            test "$(grep -o '<section class="project-section' "$page" | wc -l)" -eq 2
            test "$(grep -o 'data-ambilight-white-guard="off"' "$page" | wc -l)" -eq 4
          done
          git diff --check

      - name: Commit DEV layout correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/fjm-atlas-real-media-v1.mjs projects/fjm-atlas.html en/projects/fjm-atlas.html fr/projects/fjm-atlas.html es/projects/fjm-atlas.html archive.html en/archive.html fr/archive.html es/archive.html
          if git diff --cached --quiet; then
            echo "FJM Atlas layout already corrected."
          else
            git commit -m "Align FJM Atlas process flow and full-width tech line"
            git push origin HEAD:dev
          fi
