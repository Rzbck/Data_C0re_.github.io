name: Dev Ambilight image-only guard

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/ambilight-image-only-guard-dev.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Restrict neutral guards to images only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js = Path('assets/js/video-ambilight-v1.js')
          s = js.read_text()

          old_header = '/* DATA C0RE ambient runtime v23-dev — production Ambilight unchanged unless an ultra-conservative neutral edge veto fires. */'
          new_header = '/* DATA C0RE ambient runtime v25-dev — production video Ambilight untouched; conservative neutral veto applies to images only. */'
          assert old_header in s
          s = s.replace(old_header, new_header, 1)

          old_guard = r'''      const guard={
        left:neutralGuardEdge(data,pointSets.left),
        right:neutralGuardEdge(data,pointSets.right),
        top:neutralGuardEdge(data,pointSets.top),
        bottom:neutralGuardEdge(data,pointSets.bottom)
      };
      const vetoed=Object.keys(guard).filter(key=>guard[key].veto);
      const record={src:mediaSource(media),kind:state.kind,vetoedEdges:vetoed,edges:guard,at:performance.now()};
      guardRecords.set(media,record);
      const vetoKey=vetoed.join(',');
      if(state.guardVetoKey!==vetoKey){
        state.guardVetoKey=vetoKey;
        if(vetoed.length)console.info('[DATA C0RE Ambilight neutral guard]',record);
      }
'''
          new_guard = r'''      const guardApplies=state.kind==='image';
      const guard=guardApplies?{
        left:neutralGuardEdge(data,pointSets.left),
        right:neutralGuardEdge(data,pointSets.right),
        top:neutralGuardEdge(data,pointSets.top),
        bottom:neutralGuardEdge(data,pointSets.bottom)
      }:null;
      const vetoed=guardApplies?Object.keys(guard).filter(key=>guard[key].veto):[];
      if(guardApplies){
        const record={src:mediaSource(media),kind:state.kind,vetoedEdges:vetoed,edges:guard,at:performance.now()};
        guardRecords.set(media,record);
        const vetoKey=vetoed.join(',');
        if(state.guardVetoKey!==vetoKey){
          state.guardVetoKey=vetoKey;
          if(vetoed.length)console.info('[DATA C0RE Ambilight image neutral guard]',record);
        }
      }else if(state.guardVetoKey){
        state.guardVetoKey='';
      }
'''
          assert old_guard in s
          s = s.replace(old_guard, new_guard, 1)
          js.write_text(s)

          guard = Path('assets/js/ambilight-neutral-dominance-guard-v2.js')
          g = guard.read_text()
          g = g.replace(
            '/* DATA C0RE DEV experiment — post-process neutral-dominance veto.\n   The production Ambilight renderer remains untouched. This layer only scales an\n   emitter when the whole visible frame is overwhelmingly muted/neutral. No hue\n   is blacklisted, so real orange/red/yellow media remain valid. */',
            '/* DATA C0RE DEV experiment — image-only post-process neutral-dominance veto.\n   Video emitters are never touched: flashes, whites and neutral frames in moving\n   images keep the production Ambilight behaviour exactly as before. */',
            1
          )
          old_eligible = "  const eligibleMedia=()=>[...document.querySelectorAll('video,img')].filter(media=>!mediaRejected(media));"
          new_eligible = "  const eligibleMedia=()=>[...document.querySelectorAll('img')].filter(media=>!mediaRejected(media));"
          assert old_eligible in g
          g = g.replace(old_eligible, new_eligible, 1)

          old_ready = r'''    if(media instanceof HTMLVideoElement){
      if(media.readyState<2||!media.videoWidth||!media.videoHeight)return;
    }else if(!media.complete||!media.naturalWidth||!media.naturalHeight)return;
'''
          new_ready = r'''    if(!(media instanceof HTMLImageElement)||!media.complete||!media.naturalWidth||!media.naturalHeight)return;
'''
          assert old_ready in g
          g = g.replace(old_ready, new_ready, 1)
          guard.write_text(g)

          routes = Path('assets/js/language-routes.js')
          r = routes.read_text()
          old_main = "assets/js/video-ambilight-v1.js?v=20260820-23guarddev"
          new_main = "assets/js/video-ambilight-v1.js?v=20260820-25guarddev"
          old_post = "assets/js/ambilight-neutral-dominance-guard-v2.js?v=20260820-2"
          new_post = "assets/js/ambilight-neutral-dominance-guard-v2.js?v=20260820-3-images"
          assert old_main in r and old_post in r
          r = r.replace(old_main, new_main, 1).replace(old_post, new_post, 1)
          routes.write_text(r)
          PY

          node --check assets/js/video-ambilight-v1.js
          node --check assets/js/ambilight-neutral-dominance-guard-v2.js
          node --check assets/js/language-routes.js

      - name: Commit image-only test and remove workflow
        shell: bash
        run: |
          git config user.name 'Data_C0re_'
          git config user.email '10966796+Rzbck@users.noreply.github.com'
          git rm .github/workflows/ambilight-image-only-guard-dev.yml
          git add assets/js/video-ambilight-v1.js assets/js/ambilight-neutral-dominance-guard-v2.js assets/js/language-routes.js
          git commit -m 'Restrict neutral Ambilight suppression to images on dev'
          git push origin dev
