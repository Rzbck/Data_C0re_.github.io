name: One-time history email sanitization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, '[sanitize-history]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite private commit emails on all portfolio branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --force

          git branch -f rewrite-main origin/main
          git branch -f rewrite-fx origin/fx-video-fix-temp
          git branch -f rewrite-redesign origin/portfolio-redesign-clean

          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f \
            --env-filter '
              SAFE_EMAIL="10966796+Rzbck@users.noreply.github.com"
              case "$GIT_AUTHOR_EMAIL" in
                "chauvel.charlie@gmail.com"|"datacoredrive1@gmail.com") export GIT_AUTHOR_EMAIL="$SAFE_EMAIL" ;;
              esac
              case "$GIT_COMMITTER_EMAIL" in
                "chauvel.charlie@gmail.com"|"datacoredrive1@gmail.com") export GIT_COMMITTER_EMAIL="$SAFE_EMAIL" ;;
              esac
            ' \
            --tag-name-filter cat \
            -- rewrite-main rewrite-fx rewrite-redesign

          for ref in rewrite-main rewrite-fx rewrite-redesign; do
            if git log "$ref" --format='%ae%n%ce' | grep -E '^(chauvel\.charlie@gmail\.com|datacoredrive1@gmail\.com)$'; then
              echo "Private email still present in $ref" >&2
              exit 1
            fi
          done

          git push --force origin rewrite-main:refs/heads/main
          git push --force origin rewrite-fx:refs/heads/fx-video-fix-temp
          git push --force origin rewrite-redesign:refs/heads/portfolio-redesign-clean
          git push --force --tags origin
