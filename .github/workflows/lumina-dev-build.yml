name: Build LUMINA dev case study

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/lumina-layout-v3.mjs'
      - 'assets/css/lumina-v3.css'
      - 'assets/js/lumina-v3.js'
      - '.github/workflows/lumina-dev-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumina-dev-case-study
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install HTML transformer
        run: npm install --no-save --package-lock=false cheerio@1.0.0
      - name: Compact LUMINA into three responsive panels
        run: node scripts/lumina-layout-v3.mjs
      - name: Commit LUMINA dev build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/lumina.html en/projects/lumina.html fr/projects/lumina.html es/projects/lumina.html
          if git diff --cached --quiet; then
            echo "No LUMINA build changes."
          else
            git commit -m "Build compact LUMINA case study"
            git push origin HEAD:dev
          fi
