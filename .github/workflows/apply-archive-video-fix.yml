name: Apply final archive and video corrections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-archive-video-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install HTML dependency
        run: npm install --no-save --package-lock=false cheerio@1.0.0
      - name: Normalize archive locations and contexts
        run: node scripts/archive-location-context-fix.mjs
      - name: Apply standard project video behavior
        run: node scripts/low-bandwidth-video-fix.mjs
      - name: Verify locale parity
        run: node scripts/check-locale-parity.mjs
      - name: Commit generated pages and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-archive-video-fix.yml
          git config user.name 'Data_C0re_'
          git config user.email '10966796+Rzbck@users.noreply.github.com'
          git add -A archive.html en/archive.html fr/archive.html es/archive.html \
            projects/last-low-bandwidth-message.html \
            en/projects/last-low-bandwidth-message.html \
            fr/projects/last-low-bandwidth-message.html \
            es/projects/last-low-bandwidth-message.html \
            .github/workflows/apply-archive-video-fix.yml
          git commit -m 'Apply archive locations and standard video playback'
          git push origin HEAD:main
