name: Apply archive and video fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-archive-video-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install generator dependency
        run: npm install --no-save --package-lock=false cheerio@1.0.0

      - name: Refresh archive metadata
        run: node scripts/portfolio-v2-finalize.mjs

      - name: Normalize places and remove duplicate contexts
        run: node scripts/archive-place-context.mjs

      - name: Use standard project video playback
        run: node scripts/low-bandwidth-video-standardize.mjs

      - name: Stabilize language links
        run: node scripts/static-language-links.mjs

      - name: Verify locale parity
        run: node scripts/check-locale-parity.mjs

      - name: Commit generated fixes and remove temporary workflows
        run: |
          git config user.name 'Data_C0re_'
          git config user.email '10966796+Rzbck@users.noreply.github.com'
          git rm -f .github/workflows/apply-archive-video-fix.yml .github/workflows/reencode-low-bandwidth-preview.yml || true
          git add -A archive.html en/archive.html fr/archive.html es/archive.html \
            projects/last-low-bandwidth-message.html \
            en/projects/last-low-bandwidth-message.html \
            fr/projects/last-low-bandwidth-message.html \
            es/projects/last-low-bandwidth-message.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Normalize archive places and fix low-bandwidth playback'
            git push origin HEAD:main
          fi
