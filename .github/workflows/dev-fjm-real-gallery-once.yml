name: One-shot FJM Atlas real gallery

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/dev-fjm-real-gallery-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate script
        run: node --check scripts/fjm-atlas-real-media-v1.mjs
      - name: Apply real interface media
        run: node scripts/fjm-atlas-real-media-v1.mjs
      - name: Verify FJM Atlas real media pages
        shell: bash
        run: |
          test -s assets/media/fjm-atlas/real/02-map-overview.png
          test -s assets/media/fjm-atlas/real/04-editorial-cartel.png
          test -s assets/media/fjm-atlas/real/05-selected-location-map.png
          for page in projects/fjm-atlas.html en/projects/fjm-atlas.html fr/projects/fjm-atlas.html es/projects/fjm-atlas.html; do
            grep -q 'data-fjm-real-media-v1' "$page"
            grep -q 'assets/media/fjm-atlas/real/02-map-overview.png' "$page"
            grep -q 'assets/media/fjm-atlas/real/04-editorial-cartel.png' "$page"
            grep -q 'assets/media/fjm-atlas/real/05-selected-location-map.png' "$page"
            grep -q 'data-fjm-system-schematic' "$page"
          done
          for page in archive.html en/archive.html fr/archive.html es/archive.html; do
            grep -q 'assets/media/fjm-atlas/real/02-map-overview.png' "$page"
          done
          git diff --check
      - name: Commit real-media pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/fjm-atlas.html en/projects/fjm-atlas.html fr/projects/fjm-atlas.html es/projects/fjm-atlas.html archive.html en/archive.html fr/archive.html es/archive.html
          if git diff --cached --quiet; then
            echo "Real-media pages already applied."
          else
            git commit -m "Use real FJM Atlas interface captures on DEV"
            git push origin HEAD:dev
          fi
