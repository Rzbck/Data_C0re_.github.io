name: Repair GTG page on dev

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/dev-gtg-repair-v2.yml'
      - 'scripts/gtg-repair-v2.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gtg-repair-v2-dev
  cancel-in-progress: true

jobs:
  repair:
    if: github.ref == 'refs/heads/dev' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Select stronger official GTG media
        shell: bash
        run: |
          set -euo pipefail
          cp assets/media/grand-theatre/audit/bolero-03.jpg assets/media/grand-theatre/bolero-projection.jpg
          cp assets/media/grand-theatre/audit/don-03.jpg assets/media/grand-theatre/don-carlos-projection.jpg
          cp assets/media/grand-theatre/audit/aaip-05.jpg assets/media/grand-theatre/aaip-projection.jpg

      - name: Rebuild GTG layout and disable fullpage hijack
        run: node scripts/gtg-repair-v2.mjs

      - name: Remove temporary audit and superseded media
        shell: bash
        run: |
          rm -rf assets/media/grand-theatre/audit
          rm -f assets/media/grand-theatre/bolero-filip-van-roe.jpg
          rm -f assets/media/grand-theatre/don-carlos-gtg.jpg
          rm -f assets/media/grand-theatre/aaip-gregory-batardon.jpg
          rm -f .github/workflows/dev-gtg-photo-audit.yml
          rm -f .github/workflows/dev-gtg-repair-v2.yml
          rm -f scripts/gtg-repair-v2.mjs

      - name: Commit repaired GTG page
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair GTG layout media and mobile flow'
          git push origin HEAD:dev
