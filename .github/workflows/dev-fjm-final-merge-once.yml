name: One-shot FJM Atlas final merged case study

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/dev-fjm-final-merge-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply merged FJM Atlas layout
        run: |
          node --check scripts/fjm-atlas-real-media-v1.mjs
          node scripts/fjm-atlas-real-media-v1.mjs

      - name: Verify final compact case study
        shell: bash
        run: |
          for page in projects/fjm-atlas.html en/projects/fjm-atlas.html fr/projects/fjm-atlas.html es/projects/fjm-atlas.html; do
            test "$(grep -o '<section class="project-section' "$page" | wc -l)" -eq 2
            grep -q 'data-fjm-story' "$page"
            grep -q 'fjm-invitation-visual' "$page"
            grep -q 'Touchez la carte' "$page"
            grep -q 'data-fjm-real-media-v2' "$page"
            grep -q 'grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)' "$page"
            grep -q '<span>03</span>' "$page"
            ! grep -q 'data-fjm-compact-response' "$page"
            ! grep -q 'interface-schematic.svg' "$page"
            ! grep -q 'Current state' "$page"
            ! grep -q 'État actuel' "$page"
            ! grep -q 'Estado actual' "$page"
          done
          git diff --check

      - name: Commit final FJM Atlas case study on DEV
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/fjm-atlas.html en/projects/fjm-atlas.html fr/projects/fjm-atlas.html es/projects/fjm-atlas.html archive.html en/archive.html fr/archive.html es/archive.html
          if git diff --cached --quiet; then
            echo "Final FJM Atlas layout already applied."
          else
            git commit -m "Merge FJM Atlas brief response and invitation visual on DEV"
            git push origin HEAD:dev
          fi
