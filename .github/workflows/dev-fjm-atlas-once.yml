name: One-shot FJM Atlas DEV integration

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/dev-fjm-atlas-once.yml'
      - 'scripts/fjm-atlas-dev-integration.mjs'
      - 'scripts/fjm-atlas-copy-fix.mjs'
      - 'projects/fjm-atlas.html'
      - 'assets/media/fjm-atlas/interface-schematic.svg'
      - 'data/project-taxonomy.json'

permissions:
  contents: write

concurrency:
  group: fjm-atlas-dev-once
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate scripts
        run: |
          node --check scripts/fjm-atlas-dev-integration.mjs
          node --check scripts/fjm-atlas-copy-fix.mjs

      - name: Integrate project into generated DEV pages
        run: |
          node scripts/fjm-atlas-dev-integration.mjs
          node scripts/fjm-atlas-copy-fix.mjs

      - name: Verify archive and locale structure
        shell: bash
        run: |
          node scripts/check-project-taxonomy.mjs
          node scripts/check-locale-parity.mjs
          for f in archive.html en/archive.html fr/archive.html es/archive.html; do
            grep -q 'data-archive-project="fjm-atlas"' "$f"
          done
          for f in projects/fjm-atlas.html en/projects/fjm-atlas.html fr/projects/fjm-atlas.html es/projects/fjm-atlas.html; do
            test -s "$f"
            grep -q '<b>INDEX</b>' "$f"
          done
          git diff --check

      - name: Commit generated DEV pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/fjm-atlas.html archive.html en/archive.html fr/archive.html es/archive.html en/projects/fjm-atlas.html fr/projects/fjm-atlas.html es/projects/fjm-atlas.html
          if git diff --cached --quiet; then
            echo "FJM Atlas pages already integrated."
          else
            git commit -m "Polish FJM Atlas prototype DEV pages"
            git push origin HEAD:dev
          fi
