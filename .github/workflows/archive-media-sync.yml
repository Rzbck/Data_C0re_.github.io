name: Sync archive hover media

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
      - 'en/projects/**'
      - 'fr/projects/**'
      - 'es/projects/**'
      - 'archive.html'
      - 'en/archive.html'
      - 'fr/archive.html'
      - 'es/archive.html'
      - 'scripts/archive-video-autolink.mjs'
      - 'scripts/vendor-external-photos.mjs'
      - 'scripts/comedie-official-media-v1.mjs'
      - 'assets/js/archive-interactions.js'
      - '.github/workflows/archive-media-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-hover-media-main
  cancel-in-progress: true

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install lightweight parser
        run: npm install --no-save --package-lock=false cheerio@1.0.0

      - name: Vendor external photo assets
        run: node scripts/vendor-external-photos.mjs

      - name: Synchronize archive hover media
        run: node scripts/archive-video-autolink.mjs

      - name: Commit self-hosted photos and synchronized pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Photo assets and archive hover media already synchronized."
          else
            git commit -m "Vendor external portfolio photos on GitHub"
            git push origin HEAD:main
          fi
