name: One-shot FJM Atlas interface rebalance

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/dev-fjm-interface-layout-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate script
        run: node --check scripts/fjm-atlas-real-media-v1.mjs
      - name: Apply balanced interface layout
        run: node scripts/fjm-atlas-real-media-v1.mjs
      - name: Verify layout
        shell: bash
        run: |
          for page in projects/fjm-atlas.html en/projects/fjm-atlas.html fr/projects/fjm-atlas.html es/projects/fjm-atlas.html; do
            grep -q 'data-fjm-real-media-v2' "$page"
            grep -q 'grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)' "$page"
            grep -q 'fjm-interface-copy' "$page"
            grep -q '04-editorial-cartel.png' "$page"
            grep -q '05-selected-location-map.png' "$page"
          done
          git diff --check
      - name: Commit balanced interface pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/fjm-atlas.html en/projects/fjm-atlas.html fr/projects/fjm-atlas.html es/projects/fjm-atlas.html archive.html en/archive.html fr/archive.html es/archive.html
          if git diff --cached --quiet; then
            echo "Balanced layout already applied."
          else
            git commit -m "Rebalance FJM Atlas interface section on DEV"
            git push origin HEAD:dev
          fi
