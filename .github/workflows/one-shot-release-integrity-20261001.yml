name: One-shot release integrity refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-release-integrity-20261001.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTML tooling
        run: npm install --no-save --package-lock=false cheerio@1.0.0

      - name: Normalize canonical Home links
        run: node scripts/fix-home-navigation.mjs

      - name: Synchronize Archive taxonomy
        run: node scripts/sync-archive-taxonomy.mjs

      - name: Ensure Comédie semantic H1
        run: node scripts/ensure-comedie-semantic-title.mjs

      - name: Verify Home links
        run: node scripts/check-navigation-home-links.mjs

      - name: Verify taxonomy source
        run: node scripts/check-project-taxonomy.mjs

      - name: Verify canonical locale parity
        run: node scripts/check-locale-parity.mjs

      - name: Verify SEO architecture
        run: node scripts/check-seo-indexation-architecture.mjs

      - name: Verify no whitespace errors
        run: git diff --check

      - name: Commit refreshed static pages and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-release-integrity-20261001.yml
          git add -A archive.html fr/archive.html es/archive.html \
            projects/comedie.html fr/projects/comedie.html es/projects/comedie.html \
            index.html cv.html contact.html fr/index.html fr/cv.html fr/contact.html \
            es/index.html es/cv.html es/contact.html projects fr/projects es/projects \
            .github/workflows/one-shot-release-integrity-20261001.yml
          if git diff --cached --quiet; then
            echo "No static refresh changes to commit."
            exit 0
          fi
          git commit -m "Refresh canonical navigation and release integrity"
          git push origin HEAD:main
