name: Optimize GTG images on dev

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/dev-gtg-image-optimize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.ref == 'refs/heads/dev' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Install image library outside repository
        run: python -m pip install --quiet pillow
      - name: Optimize responsive GTG images
        shell: bash
        run: |
          python <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          files = [
              Path('assets/media/grand-theatre/don-carlos-projection.jpg'),
              Path('assets/media/grand-theatre/bolero-projection.jpg'),
              Path('assets/media/grand-theatre/aaip-projection.jpg'),
          ]
          for path in files:
              with Image.open(path) as im:
                  im = ImageOps.exif_transpose(im).convert('RGB')
                  if im.width > 1800:
                      h = round(im.height * 1800 / im.width)
                      im = im.resize((1800, h), Image.Resampling.LANCZOS)
                  im.save(path, 'JPEG', quality=84, optimize=True, progressive=True)
          PY
          rm -f .github/workflows/dev-gtg-image-optimize.yml
      - name: Commit only image optimization and workflow cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/media/grand-theatre/don-carlos-projection.jpg assets/media/grand-theatre/bolero-projection.jpg assets/media/grand-theatre/aaip-projection.jpg .github/workflows/dev-gtg-image-optimize.yml
          git commit -m 'Optimize GTG projection images for mobile'
          git push origin HEAD:dev
