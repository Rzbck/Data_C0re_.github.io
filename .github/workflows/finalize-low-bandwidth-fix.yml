name: Finalize low-bandwidth media fix

on:
  push:
    branches: [fix-low-bandwidth-20260816]
    paths:
      - '.github/workflows/finalize-low-bandwidth-fix.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix-low-bandwidth-20260816
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install HTML dependency
        run: npm install --no-save --package-lock=false cheerio@1.0.0

      - name: Reassemble real MP4 from staged chunks
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/low-bandwidth-excerpt/part* | tr -d '\n\r ' | base64 --decode > assets/media/low-bandwidth-message/excerpt.mp4
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/media/low-bandwidth-message/excerpt.mp4')
          data=p.read_bytes()
          assert len(data) > 50000, f'video too small: {len(data)}'
          assert data[4:8] == b'ftyp', 'missing MP4 ftyp atom'
          moov=data.find(b'moov'); mdat=data.find(b'mdat')
          assert moov > 0 and mdat > 0, f'invalid MP4 atoms: moov={moov} mdat={mdat}'
          assert moov < mdat, f'MP4 is not faststart: moov={moov} mdat={mdat}'
          print(f'Valid MP4: {len(data)} bytes / moov={moov} / mdat={mdat}')
          PY

      - name: Apply Archive locations and remove duplicate context headings
        run: node scripts/archive-location-context-fix.mjs

      - name: Use shared project video loading behavior
        run: node scripts/low-bandwidth-video-fix.mjs

      - name: Clean temporary transfer and failed experiment
        shell: bash
        run: |
          rm -rf .tmp/low-bandwidth-excerpt
          rmdir .tmp 2>/dev/null || true
          rm -f .github/workflows/reencode-low-bandwidth-preview.yml
          rm -f .github/workflows/finalize-low-bandwidth-fix.yml

      - name: Commit final fix
        shell: bash
        run: |
          git config user.name 'Data_C0re_'
          git config user.email '10966796+Rzbck@users.noreply.github.com'
          git add -A
          git commit -m 'Fix small-file video and normalize archive locations'
          git push origin HEAD:fix-low-bandwidth-20260816
