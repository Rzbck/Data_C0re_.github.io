name: Reencode low-bandwidth preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reencode-low-bandwidth-preview.yml'

permissions:
  contents: write

jobs:
  reencode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reencode excerpt for Safari and mobile
        run: |
          ffmpeg -y \
            -i assets/media/low-bandwidth-message/excerpt.mp4 \
            -an \
            -c:v libx264 \
            -profile:v baseline \
            -level:v 3.0 \
            -pix_fmt yuv420p \
            -r 10 \
            -g 10 \
            -keyint_min 10 \
            -bf 0 \
            -crf 28 \
            -preset slow \
            -movflags +faststart \
            /tmp/excerpt-safari.mp4
          mv /tmp/excerpt-safari.mp4 assets/media/low-bandwidth-message/excerpt.mp4
          ffprobe -v error -show_entries stream=codec_name,profile,level,pix_fmt,width,height,r_frame_rate -show_entries format=duration,size -of default=nw=1 assets/media/low-bandwidth-message/excerpt.mp4
          python3 - <<'PY'
          from pathlib import Path
          data=Path('assets/media/low-bandwidth-message/excerpt.mp4').read_bytes()
          moov=data.find(b'moov')
          mdat=data.find(b'mdat')
          if moov < 0 or mdat < 0 or moov > mdat:
              raise SystemExit(f'faststart check failed: moov={moov}, mdat={mdat}')
          print(f'faststart OK: moov={moov}, mdat={mdat}')
          PY

      - name: Commit Safari-safe excerpt
        run: |
          git config user.name 'Data_C0re_'
          git config user.email '10966796+Rzbck@users.noreply.github.com'
          git add assets/media/low-bandwidth-message/excerpt.mp4
          if git diff --cached --quiet; then
            echo 'No media change.'
            exit 0
          fi
          git commit -m 'Reencode low-bandwidth excerpt for Safari'
          git push origin HEAD:main
