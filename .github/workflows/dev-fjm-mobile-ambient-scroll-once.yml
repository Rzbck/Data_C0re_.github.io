name: One-shot FJM mobile Ambilight scroll stability

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/dev-fjm-mobile-ambient-scroll-once.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Patch FJM mobile Ambilight continuity only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          amb = Path('assets/js/video-ambilight-v1.js')
          s = amb.read_text(encoding='utf-8')

          marker = "  const schedule=(delay=videoInterval)=>{\n"
          insert = """  /* FJM Atlas mobile: static captures share one cyan visual language. During kinetic\n     scrolling, freeze the last sampled static emitter instead of letting IntersectionObserver\n     hand-offs briefly drop the page Ambilight between large images. Desktop and every other\n     project keep the standard runtime. */\n  const fjmMobilePage=()=>coarse&&document.body?.classList.contains('fjm-atlas-page');\n  const fjmStaticMedia=(media,state)=>Boolean(fjmMobilePage()&&state.kind==='image'&&media.dataset.ambilightWhiteGuard==='off');\n  let fjmLastStatic=null;\n  let fjmScrollCarry=null;\n\n"""
          if 'const fjmMobilePage=' not in s:
              if marker not in s:
                  raise SystemExit('Ambilight schedule marker not found')
              s = s.replace(marker, insert + marker, 1)

          pattern = re.compile(r"  const tick=now=>\{[\s\S]*?\n  \};\n  const wake=\(\)=>schedule\(0\);", re.M)
          replacement = """  const tick=now=>{\n    if(document.hidden)return;\n    const scrolling=document.documentElement.hasAttribute('data-dc-media-scrolling');\n    const active=[];\n    const fjmVisible=[];\n    for(const [media,state] of states){\n      const on=state.kind==='video'?videoIsActive(media,state):imageIsActive(media,state);\n      const carry=!on&&state.kind==='video'&&luminaCarryActive(media,state);\n      if(on||carry){\n        state.emitter.classList.toggle('is-active',state.energy>.008||on);\n        active.push([media,state,carry,false]);\n        if(on&&fjmStaticMedia(media,state))fjmVisible.push([media,state]);\n      }else state.emitter.classList.remove('is-active');\n    }\n\n    if(fjmMobilePage()){\n      if(!scrolling){\n        if(fjmVisible.length){\n          fjmLastStatic=fjmVisible.reduce((best,row)=>row[1].ratio>best[1].ratio?row:best,fjmVisible[0]);\n        }\n        fjmScrollCarry=null;\n      }else{\n        if(!fjmScrollCarry){\n          const best=fjmVisible.length?fjmVisible.reduce((winner,row)=>row[1].ratio>winner[1].ratio?row:winner,fjmVisible[0]):null;\n          fjmScrollCarry=(fjmLastStatic&&fjmLastStatic[1].energy>.008)?fjmLastStatic:best;\n        }\n        if(fjmScrollCarry){\n          const [carryMedia,carryState]=fjmScrollCarry;\n          if(carryState.energy<=.008&&imageIsActive(carryMedia,carryState)){\n            carryState.lastSample=now;\n            sample(carryMedia,carryState);\n          }\n          for(const [media,state] of states){\n            if(fjmStaticMedia(media,state))state.emitter.classList.toggle('is-active',state===carryState&&carryState.energy>.008);\n          }\n          for(let i=active.length-1;i>=0;i--){\n            if(fjmStaticMedia(active[i][0],active[i][1]))active.splice(i,1);\n          }\n          if(carryState.energy>.008)active.push([carryMedia,carryState,false,true]);\n        }\n      }\n    }else{\n      fjmLastStatic=null;\n      fjmScrollCarry=null;\n    }\n\n    if(!active.length){document.body?.classList.remove('video-page-ambient-active');return}\n    document.body?.classList.add('video-page-ambient','video-page-ambient-active');\n    if(scrolling){\n      for(const [media,state,,freezeGeometry] of active)if(!freezeGeometry)updateGeometry(media,state,active.length);\n      schedule(coarse?260:180);\n      return;\n    }\n    for(const [media,state,carry] of active){\n      const due=state.kind==='video'?videoInterval:imageInterval;\n      if(!carry&&now-state.lastSample>=due){state.lastSample=now;sample(media,state)}\n      updateGeometry(media,state,active.length);\n    }\n    schedule();\n  };\n  const wake=()=>schedule(0);"""
          if 'fjmScrollCarry' not in s:
              raise SystemExit('FJM carry prelude was not inserted')
          if 'freezeGeometry' not in s:
              s, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit(f'Expected one tick block, patched {count}')

          amb.write_text(s, encoding='utf-8')

          routes = Path('assets/js/language-routes.js')
          r = routes.read_text(encoding='utf-8')
          old_video = "ensureScript('assets/js/video-ambilight-v1.js?v=20260820-22','data-video-ambilight');"
          new_video = "ensureScript('assets/js/video-ambilight-v1.js?v=20260909-fjm-mobile1','data-video-ambilight');"
          if old_video in r:
              r = r.replace(old_video, new_video, 1)
          elif new_video not in r:
              raise SystemExit('Expected Ambilight loader version not found')

          old_perf = "if(perfProbeEnabled)ensureScript('assets/js/adaptive-performance-v1.js?v=20260826-v5','data-adaptive-performance');"
          new_perf = "const fjmAtlasRoute=/(^|\\/)projects\\/fjm-atlas\\.html$/.test(location.pathname);\n  if(perfProbeEnabled&&!fjmAtlasRoute)ensureScript('assets/js/adaptive-performance-v1.js?v=20260826-v5','data-adaptive-performance');"
          if old_perf in r:
              r = r.replace(old_perf, new_perf, 1)
          elif new_perf not in r:
              raise SystemExit('Expected adaptive-performance loader line not found')
          routes.write_text(r, encoding='utf-8')
          PY

          node --check assets/js/video-ambilight-v1.js
          node --check assets/js/language-routes.js

      - name: Verify targeted mobile scroll fix
        shell: bash
        run: |
          grep -q "const fjmMobilePage=()=>coarse&&document.body?.classList.contains('fjm-atlas-page')" assets/js/video-ambilight-v1.js
          grep -q "fjmScrollCarry" assets/js/video-ambilight-v1.js
          grep -q "freezeGeometry" assets/js/video-ambilight-v1.js
          grep -q "video-ambilight-v1.js?v=20260909-fjm-mobile1" assets/js/language-routes.js
          grep -Fq "if(perfProbeEnabled&&!fjmAtlasRoute)" assets/js/language-routes.js
          grep -q 'grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)' fr/projects/fjm-atlas.html
          grep -q 'fjm-story-tech{grid-column:1 / -1;width:100%' fr/projects/fjm-atlas.html
          test "$(grep -o 'data-ambilight-white-guard=\"off\"' fr/projects/fjm-atlas.html | wc -l)" -eq 4
          git diff --check

      - name: Commit DEV fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/video-ambilight-v1.js assets/js/language-routes.js
          if git diff --cached --quiet; then
            echo "FJM mobile Ambilight continuity already applied."
          else
            git commit -m "Stabilize FJM Atlas Ambilight during mobile scroll"
            git push origin HEAD:dev
          fi
