name: Mobile media controller integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-media-controller-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Integrate centralized mobile media runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          # Shared route loader: mobile controller becomes the only mobile playback authority.
          p = Path('assets/js/language-routes.js')
          text = p.read_text(encoding='utf-8')
          marker = "  ensureScript('assets/js/menu-card-trail.js?v=20260816-1','data-menu-card-trail');\n"
          addition = marker + "  ensureScript('assets/js/mobile-media-controller-v1.js?v=20260819-mobile1','data-mobile-media-controller');\n"
          text = replace_once(text, marker, addition, 'language-routes controller loader')
          text = re.sub(r"assets/js/video-ambilight-v1\.js\?v=[^']+", "assets/js/video-ambilight-v1.js?v=20260819-21", text, count=1)
          p.write_text(text, encoding='utf-8')

          # main.js: keep desktop behavior unchanged; delegate mobile page video ownership.
          p = Path('assets/js/main.js')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text,
              "  addCss('assets/css/mobile-hardening.css','data-mobile-hardening');",
              "  addCss('assets/css/mobile-hardening.css?v=20260819-mobile1','data-mobile-hardening');",
              'main mobile css cache bust')

          lumina_marker = "  const experienceSection=document.querySelector('[data-lumina-experience-section]');"
          lumina_replacement = "  const mobileMediaManaged=matchMedia('(max-width:820px), (pointer:coarse)').matches;\n  if(mobileMediaManaged)return;\n" + lumina_marker
          text = replace_once(text, lumina_marker, lumina_replacement, 'main lumina legacy mobile guard')

          page_block = re.compile(
              r"  const pageVideos=qa\('video:not\(\[data-hover-preview-video\]\):not\(\[data-stagger-video\]\):not\(\[data-work-preview-video\]\)'\);\n"
              r"  const syncVideo=v=>\{.*?\};\n"
              r"  const observer=new IntersectionObserver\(entries=>entries\.forEach\(entry=>\{.*?\}\),\{rootMargin:'180px 0px',threshold:\.05\}\);\n"
              r"  pageVideos\.forEach\(v=>observer\.observe\(v\)\);",
              re.S
          )
          replacement = """  const pageVideos=qa('video:not([data-hover-preview-video]):not([data-stagger-video]):not([data-work-preview-video])');
  const mobileMediaManaged=()=>matchMedia('(max-width:820px), (pointer:coarse)').matches;
  const syncVideo=v=>{
    if(mobileMediaManaged()){
      const controller=window.DATA_C0RE_MEDIA_CONTROLLER;
      if(controller){controller.register(v);controller.sync(v)}
      return;
    }
    const visible=v.dataset.visible!=='false'&&!document.hidden;
    if(!motionOff&&visible){if(v.matches('[data-lazy-video]'))loadLazy(v);v.play().catch(()=>{})}else v.pause();
  };
  let observer=null;
  if(!mobileMediaManaged()){
    observer=new IntersectionObserver(entries=>entries.forEach(entry=>{
      const v=entry.target,was=v.dataset.visible==='true',now=entry.isIntersecting;
      v.dataset.visible=String(now);
      if(now&&v.matches('[data-lazy-video]'))loadLazy(v);
      if(now&&!was)seekWhenReady(v);
      syncVideo(v);
    }),{rootMargin:'180px 0px',threshold:.05});
    pageVideos.forEach(v=>observer.observe(v));
  }else{
    const registerMobileVideos=()=>window.DATA_C0RE_MEDIA_CONTROLLER?.registerAll(pageVideos);
    if(window.DATA_C0RE_MEDIA_CONTROLLER)registerMobileVideos();
    else addEventListener('data-c0re-media-controller-ready',registerMobileVideos,{once:true});
  }"""
          text, count = page_block.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'main generic video block: expected one match, got {count}')
          text = text.replace("assets/js/fullpage.js'", "assets/js/fullpage.js?v=20260819-mobile1'", 1)
          p.write_text(text, encoding='utf-8')

          # Ambilight becomes passive on controller-owned mobile videos and freezes readbacks during kinetic scroll.
          p = Path('assets/js/video-ambilight-v1.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace('ambient runtime v20', 'ambient runtime v21', 1)
          old = "  const shouldAutoResume=video=>{\n    if(!video.muted||video.dataset.perfDetached==='true'||mediaRejected(video))return false;"
          new = "  const shouldAutoResume=video=>{\n    if(window.DATA_C0RE_MEDIA_CONTROLLER?.owns?.(video))return false;\n    if(!video.muted||video.dataset.perfDetached==='true'||mediaRejected(video))return false;"
          text = replace_once(text, old, new, 'ambilight passive ownership')
          old = "      if(state.visible&&!document.hidden&&video.paused&&shouldAutoResume(video))video.play().catch(()=>{});wake();"
          new = "      wake();"
          text = replace_once(text, old, new, 'ambilight observer autoplay removal')
          old = "    if(!active.length){document.body?.classList.remove('video-page-ambient-active');return}\n    document.body?.classList.add('video-page-ambient','video-page-ambient-active');"
          new = """    if(!active.length){document.body?.classList.remove('video-page-ambient-active');return}
    document.body?.classList.add('video-page-ambient','video-page-ambient-active');
    if(document.documentElement.hasAttribute('data-dc-media-scrolling')){
      for(const [media,state] of active)updateGeometry(media,state,active.length);
      schedule(coarse?260:180);
      return;
    }"""
          text = replace_once(text, old, new, 'ambilight kinetic freeze')
          p.write_text(text, encoding='utf-8')

          # Mobile full-page navigation keeps native compositor scrolling; CSS proximity snap preserves the existing section feel.
          p = Path('assets/js/fullpage.js')
          text = p.read_text(encoding='utf-8')
          text, count = re.subn(
              r"  const touchEligible=\(\)=>filename!=='comedie\.html'&&window\.matchMedia\('\(max-width:820px\), \(pointer:coarse\)'\)\.matches&&!reduce\.matches;",
              "  const touchEligible=()=>false; // mobile uses native compositor scroll + CSS proximity snap",
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f'fullpage touch guard: expected one match, got {count}')
          p.write_text(text, encoding='utf-8')

          # LUMINA has an older inline playback orchestrator. Disable only its mobile video observers;
          # technical tabs / plan UI remain untouched. The shared controller preserves timeline/rate data.
          lumina_pages = [Path('projects/lumina.html'), Path('en/projects/lumina.html'), Path('fr/projects/lumina.html'), Path('es/projects/lumina.html')]
          for p in lumina_pages:
              text = p.read_text(encoding='utf-8')
              marker = "  const experienceSection=document.querySelector('[data-lumina-experience-section]');"
              if 'const mobileMediaManaged=matchMedia' not in text:
                  text = replace_once(text, marker,
                      "  const mobileMediaManaged=matchMedia('(max-width:820px), (pointer:coarse)').matches;\n" + marker,
                      f'{p} mobile marker')
              text = text.replace('if(experienceSection&&experience.length){', 'if(!mobileMediaManaged&&experienceSection&&experience.length){', 1)
              text = text.replace('  fabrication.forEach(v=>fabricationObserver.observe(v));', '  if(!mobileMediaManaged)fabrication.forEach(v=>fabricationObserver.observe(v));', 1)
              text = text.replace('  const sync=()=>{', '  const sync=()=>{\n    if(mobileMediaManaged)return;', 1)
              p.write_text(text, encoding='utf-8')

          # Cache-bust the shared loaders across all static routes.
          for p in Path('.').rglob('*.html'):
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'assets/js/language-routes\.js(?:\?v=[^\"\']+)?', 'assets/js/language-routes.js?v=20260819-mobile1', text)
              text = re.sub(r'((?:\.\./|\./)?assets/js/main\.js)(?:\?v=[^\"\']+)?', r'\1?v=20260819-mobile1', text)
              p.write_text(text, encoding='utf-8')

          Path('.github/workflows/mobile-media-controller-integration.yml').unlink()
          PY

      - name: Validate JavaScript and integration invariants
        run: |
          node --check assets/js/mobile-media-controller-v1.js
          node --check assets/js/main.js
          node --check assets/js/video-ambilight-v1.js
          node --check assets/js/fullpage.js
          node --check assets/js/language-routes.js
          python - <<'PY'
          from pathlib import Path
          import re

          lr=Path('assets/js/language-routes.js').read_text()
          assert 'mobile-media-controller-v1.js?v=20260819-mobile1' in lr
          assert 'video-ambilight-v1.js?v=20260819-21' in lr

          amb=Path('assets/js/video-ambilight-v1.js').read_text()
          assert "DATA_C0RE_MEDIA_CONTROLLER?.owns?.(video)" in amb
          assert "data-dc-media-scrolling" in amb

          main=Path('assets/js/main.js').read_text()
          assert "data-c0re-media-controller-ready" in main
          assert "fullpage.js?v=20260819-mobile1" in main

          for p in [Path('projects/lumina.html'),Path('en/projects/lumina.html'),Path('fr/projects/lumina.html'),Path('es/projects/lumina.html')]:
              text=p.read_text()
              assert "const mobileMediaManaged=matchMedia" in text, p
              assert "if(!mobileMediaManaged&&experienceSection&&experience.length)" in text, p
              assert "if(!mobileMediaManaged)fabrication.forEach" in text, p

          bad=[]
          for p in Path('.').rglob('*.html'):
              text=p.read_text(encoding='utf-8')
              if 'assets/js/language-routes.js' in text and 'assets/js/language-routes.js?v=20260819-mobile1' not in text:
                  bad.append(str(p))
          assert not bad, f'uncachebusted language-routes pages: {bad[:10]}'
          PY
          git diff --check

      - name: Commit mobile media architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Centralize mobile video playback and smooth media scrolling"
          git push origin main
