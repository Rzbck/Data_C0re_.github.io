name: Fix Archive Ambilight guard on dev

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/fix-archive-ambilight-guard-dev.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Bind image guard only to image emitters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          guard = Path('assets/js/ambilight-neutral-dominance-guard-v2.js')
          g = guard.read_text()
          old = "const emitters=[...document.querySelectorAll('.video-ambient-field .video-ambient-emitter')];"
          new = "const emitters=[...document.querySelectorAll('.video-ambient-field .video-ambient-emitter[data-static=\"true\"]')];"
          assert old in g, 'expected generic emitter selector not found'
          g = g.replace(old, new, 1)
          guard.write_text(g)

          routes = Path('assets/js/language-routes.js')
          r = routes.read_text()
          old_ver = "assets/js/ambilight-neutral-dominance-guard-v2.js?v=20260820-3-images"
          new_ver = "assets/js/ambilight-neutral-dominance-guard-v2.js?v=20260820-4-images-archive"
          assert old_ver in r, 'expected guard cache version not found'
          routes.write_text(r.replace(old_ver, new_ver, 1))
          PY

          node --check assets/js/ambilight-neutral-dominance-guard-v2.js
          node --check assets/js/language-routes.js

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'Data_C0re_'
          git config user.email '10966796+Rzbck@users.noreply.github.com'
          git rm .github/workflows/fix-archive-ambilight-guard-dev.yml
          git add assets/js/ambilight-neutral-dominance-guard-v2.js assets/js/language-routes.js
          git commit -m 'Restore Archive Ambilight with image-only neutral guard'
          git push origin dev
