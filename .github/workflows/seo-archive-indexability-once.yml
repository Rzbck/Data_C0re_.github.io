name: One-shot Archive indexability fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/seo-archive-indexability-once.yml

permissions:
  contents: write

concurrency:
  group: seo-archive-indexability-once
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded SEO-only patch
        shell: python
        run: |
          from pathlib import Path

          archive_path = Path('archive.html')
          archive = archive_path.read_text(encoding='utf-8')
          old_robots = '<meta name="robots" content="noindex,follow">'
          new_robots = '<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">'
          canonical = '<link rel="canonical" href="https://datac0re.is-a.dev/archive.html">'

          if archive.count(old_robots) != 1:
              raise SystemExit('Safety stop: expected exactly one Archive noindex tag.')
          if canonical not in archive:
              raise SystemExit('Safety stop: Archive canonical is not the production URL.')

          archive_path.write_text(archive.replace(old_robots, new_robots, 1), encoding='utf-8')

          generator_path = Path('scripts/portfolio-architecture.mjs')
          generator = generator_path.read_text(encoding='utf-8')
          marker = '// DATA C0RE SEO ARCHIVE INDEXABILITY GUARD'
          if marker in generator:
              raise SystemExit('Safety stop: generator guard already exists.')

          guard = r'''

// DATA C0RE SEO ARCHIVE INDEXABILITY GUARD
// archive.html is generated from the legacy Lab template, which is intentionally noindex.
// Keep the public Archive hub indexable without changing Lab or the visual layer.
{
  const archivePath = path.join(ROOT, 'archive.html');
  const html = fs.readFileSync(archivePath, 'utf8');
  const robots = '<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">';
  const next = html.replace(/<meta name="robots" content="[^"]*">/i, robots);
  if (next === html && !html.includes(robots)) throw new Error('Archive robots meta tag not found');
  if (next !== html) fs.writeFileSync(archivePath, next, 'utf8');
}
'''
          generator_path.write_text(generator.rstrip() + guard, encoding='utf-8')

      - name: Validate patch scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/portfolio-architecture.mjs
          grep -Fq '<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">' archive.html
          grep -Fq '<link rel="canonical" href="https://datac0re.is-a.dev/archive.html">' archive.html
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "archive.html scripts/portfolio-architecture.mjs "

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/seo-archive-indexability-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A archive.html scripts/portfolio-architecture.mjs .github/workflows/seo-archive-indexability-once.yml
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/seo-archive-indexability-once.yml archive.html scripts/portfolio-architecture.mjs "
          git commit -m "Fix Archive indexability and generator guard"
          git push origin HEAD:main
