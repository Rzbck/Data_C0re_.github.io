name: One-shot FJM Atlas real media

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/dev-fjm-real-media-once.yml'

permissions:
  contents: write

jobs:
  import-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Download temporary HD export artifact
        shell: bash
        run: |
          curl --fail --location --retry 2 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-fb1c-8210-a281-9aeab410b92b/raw?se=2026-09-09T06%3A08%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=080faf61-fd81-537e-bfa1-cd12d20310c5&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T03%3A21%3A01Z&ske=2026-09-10T03%3A21%3A01Z&sks=b&skv=2026-02-06&sig=r9ks0pAbWHgHlFq3IeNtsnVXSB02MALAgNAscU2PWIw%3D' -o /tmp/fjm-atlas-portfolio-hd.zip
          rm -rf /tmp/fjm-atlas-media
          mkdir -p /tmp/fjm-atlas-media assets/media/fjm-atlas/real
          unzip -q /tmp/fjm-atlas-portfolio-hd.zip -d /tmp/fjm-atlas-media
          cp /tmp/fjm-atlas-media/02-map-overview.png assets/media/fjm-atlas/real/
          cp /tmp/fjm-atlas-media/04-editorial-cartel.png assets/media/fjm-atlas/real/
          cp /tmp/fjm-atlas-media/05-selected-location-map.png assets/media/fjm-atlas/real/
          test -s assets/media/fjm-atlas/real/02-map-overview.png
          test -s assets/media/fjm-atlas/real/04-editorial-cartel.png
          test -s assets/media/fjm-atlas/real/05-selected-location-map.png
      - name: Commit HD real media to DEV
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media/fjm-atlas/real/*.png
          if git diff --cached --quiet; then
            echo "HD real media already present."
          else
            git commit -m "Add HD FJM Atlas interface screenshots on DEV"
            git push origin HEAD:dev
          fi
