name: Dispatch verified SEO production build once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-release-dispatch-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production-localization:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing production localization workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run localize.yml --ref main
