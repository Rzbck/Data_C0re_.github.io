name: Optimize Comedie transit images on dev

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/optimize-transit-images-dev.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Optimize En transit JPEGs
        run: |
          set -euo pipefail
          echo 'Before:'
          ls -lh assets/media/comedie/transit/official-*.jpg
          for f in assets/media/comedie/transit/official-*.jpg; do
            tmp="${f%.jpg}.optimized.jpg"
            convert "$f" -auto-orient -resize '1800x1800>' -strip -sampling-factor 4:2:0 -interlace Plane -quality 84 "$tmp"
            mv "$tmp" "$f"
          done
          echo 'After:'
          ls -lh assets/media/comedie/transit/official-*.jpg

      - name: Commit optimized media
        run: |
          if git diff --quiet -- assets/media/comedie/transit/; then
            echo 'No media changes.'
            exit 0
          fi
          git config user.name 'Data_C0re_'
          git config user.email '10966796+Rzbck@users.noreply.github.com'
          git add assets/media/comedie/transit/official-*.jpg
          git commit -m 'Optimize Comedie En transit images'
          git push origin HEAD:dev
