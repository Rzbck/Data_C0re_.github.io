name: Reapply optimized Comedie transit images on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reapply-transit-optimized-main.yml'

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore validated optimized transit images
        run: |
          set -euo pipefail
          git checkout c916f350d8fbc6b1092bc3278d7a90a2a8b47ae1 -- \
            assets/media/comedie/transit/official-01.jpg \
            assets/media/comedie/transit/official-02.jpg \
            assets/media/comedie/transit/official-03.jpg
          ls -lh assets/media/comedie/transit/official-*.jpg
      - name: Commit validated optimized images
        run: |
          if git diff --quiet -- assets/media/comedie/transit/; then
            echo 'No media changes.'
            exit 0
          fi
          git config user.name 'Data_C0re_'
          git config user.email '10966796+Rzbck@users.noreply.github.com'
          git add assets/media/comedie/transit/official-*.jpg
          git commit -m 'Restore optimized Comedie En transit images'
          git push origin HEAD:main
